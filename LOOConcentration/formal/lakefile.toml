name = "looconcentration-loo"
version = "0.1.0"
defaultTargets = ["LOOConcentrationRevision", "LOOConcentrationManuscript"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
linter.unusedVariables = true
linter.unusedSectionVars = true
linter.unusedSimpArgs = true
linter.unnecessarySimpa = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "LOOConcentration"
roots = []
globs = ["LOOConcentration.+"]

[[lean_lib]]
name = "LOOConcentrationRevision"

[[lean_lib]]
name = "LOOConcentrationManuscript"

[[lean_lib]]
name = "BoundedCenteredLpFinalEpsilonSource"

[[lean_lib]]
name = "BoundedCenteredLpSourceAssembly"

[[lean_lib]]
name = "MomentFinishSupport"

[[lean_lib]]
name = "NoncenteredLpSourceAssembly"

[[lean_lib]]
name = "StandingI1ActualMomentSource"

[[lean_lib]]
name = "UnboundedSharpNormMomentSource"
