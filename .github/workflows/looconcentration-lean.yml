name: LOOConcentration

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: looconcentration-lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-and-audit:
    name: Build manuscript and audit axioms
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: "2"
    defaults:
      run:
        working-directory: LOOConcentration/formal
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Lean and dependency caches
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: LOOConcentration/formal
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "true"

      - name: Build the manuscript release and audit interfaces
        run: |
          python3 scripts/ci.py

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: looconcentration-lean-validation
          path: |
            LOOConcentration/formal/challenges/reports/
            LOOConcentration/formal/verification/
          if-no-files-found: warn
          retention-days: 14
